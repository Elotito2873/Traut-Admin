name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  linux-web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2
      - run: flutter pub get
      - name: Build Linux
        run: >-
          flutter build linux --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=REQUIRE_ADMIN_MFA=true
      - name: Package Linux
        run: |
          CLEAN_VERSION="${VERSION#v}"
          chmod +x scripts/build_appimage.sh packaging/linux/AppRun
          scripts/build_appimage.sh "$CLEAN_VERSION"
          tar -C build/linux/x64/release -czf "packaging/output/TrautAdmin-linux-x86_64-v${CLEAN_VERSION}.tar.gz" bundle
      - name: Build and package Web
        run: |
          CLEAN_VERSION="${VERSION#v}"
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=REQUIRE_ADMIN_MFA=true
          cd build/web
          zip -r "../../packaging/output/TrautAdmin-web-v${CLEAN_VERSION}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-web
          path: packaging/output/*

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: >-
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=REQUIRE_ADMIN_MFA=true
      - name: Package ZIP and installer
        shell: pwsh
        run: |
          $cleanVersion = $env:VERSION.TrimStart('v')
          New-Item -ItemType Directory -Force packaging/output | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "packaging/output/TrautAdmin-windows-x64-v$cleanVersion.zip"
          choco install innosetup --no-progress -y
          $env:TRAUT_VERSION = $cleanVersion
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/traut_admin.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/output/*

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: >-
          flutter build macos --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=REQUIRE_ADMIN_MFA=true
      - name: Optional code signing
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temporary build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temporary build.keychain
          codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" "build/macos/Build/Products/Release/Traut Admin.app"
      - name: Package DMG
        run: |
          CLEAN_VERSION="${VERSION#v}"
          mkdir -p packaging/output dmg
          cp -R "build/macos/Build/Products/Release/Traut Admin.app" "dmg/Traut Admin.app"
          hdiutil create -volname "Traut Admin" -srcfolder dmg -ov -format UDZO "packaging/output/TrautAdmin-macos-v${CLEAN_VERSION}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "dmg/Traut Admin.app" "packaging/output/TrautAdmin-macos-v${CLEAN_VERSION}.zip"
      - name: Optional notarization
        if: ${{ env.APPLE_ID != '' }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          xcrun notarytool submit "packaging/output/TrautAdmin-macos-v${CLEAN_VERSION}.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "packaging/output/TrautAdmin-macos-v${CLEAN_VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: packaging/output/*

  publish:
    needs: [linux-web, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
