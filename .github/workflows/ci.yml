name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno check supabase/functions/invite-driver/index.ts
      - run: deno test supabase/functions/invite-driver/index_test.ts
